<div class="auth-container">

  <div class="auth-card">

    <h2>Register</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <input
          type="text"
          placeholder="Username"
          formControlName="username"
        />
        <small *ngIf="registerForm.controls['username'].touched && registerForm.controls['username'].invalid">
          Username must be at least 3 characters
        </small>
      </div>

      <div class="form-group">
        <input
          type="email"
          placeholder="Email"
          formControlName="email"
        />
        <small *ngIf="registerForm.controls['email'].touched && registerForm.controls['email'].invalid">
          Please enter a valid email
        </small>
      </div>

      <div class="form-group password-field">

        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          formControlName="password"
        />

        <span class="eye" (click)="togglePassword()">
          {{ showPassword ? '🙈' : '👁️' }}
        </span>

        <small *ngIf="registerForm.controls['password'].touched && registerForm.controls['password'].invalid">
          Password must be at least 6 characters
        </small>

      </div>

      <button type="submit" [disabled]="registerForm.invalid">
        Create Account
      </button>

    </form>

    <p>
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
